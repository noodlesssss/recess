# 硬规则词表 / Hard-rule blocklist
#
# 这些词出现在任何字段里，投稿就被拦下。这里拦的是「对读者说话」的指令口吻，
# 不是拦话题。词表可以迭代：加词 → 跑 `bun test` → 提 PR。
#
# 匹配方式（见 src/lib/rules.ts）：
#   - 全部先做 NFKC 规范化 + 转小写（全角 Ｉｇｎｏｒｅ → ignore）。
#   - zh / ja：再去掉所有空白、标点、零宽字符，做子串匹配。"忽 略"、"忽.略" 都命中。
#   - en：把非字母数字压成一个空格，按「词首」匹配：" ignore" 命中 "ignored"，
#     但 "contact as" 不会命中 "act as"。字母之间插空格的（"i g n o r e"）由
#     另一条规则 obfuscation 拦。
#   - 宁可误伤：中文「你要」会拦掉故事里的对话「妈妈说你要多吃点」。投稿人换个说法就行。
#   - 三种语言的词表对所有投稿都生效（中文投稿里夹英文指令也要拦）。

