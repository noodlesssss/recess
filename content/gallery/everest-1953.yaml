id: everest-1953
hall: gallery
flavor: triumph
lang: zh
title: 世界最高处的十五分钟
cause: 在此之前，人们一次次往珠穆朗玛峰顶冲，都没能上去。1953 年春天，又一支登山队来了，到最后一程，只剩希拉里和丹增两个人往上走。
course: 5 月 29 日上午十一点半，两人站上了峰顶。他们在那里只待了大约十五分钟：希拉里给丹增拍了一张举着冰镐、挂着旗子的照片，丹增在雪里埋下一点巧克力和饼干，当作给山的供品。
result: 然后他们转身下山。山下的队友远远看见两个小黑点安然下来，抱在一起。
source: 1953 年英国珠峰登山队的记录
