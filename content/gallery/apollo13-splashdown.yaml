hall: gallery
flavor: relief
lang: zh
title: 无线电里又有了声音
cause: 1970 年，阿波罗 13 号飞往月球的路上，一个氧气罐爆炸了。三名宇航员放弃登月，挤在登月舱里，靠一路临时想出来的办法绕月飞回地球。
course: 飞船重返大气层时，按惯例会有约四分钟联络不上。那一次，休斯敦的控制室等了四分钟，没有声音，五分钟，还是没有。
result: 大约六分钟后，无线电里传来斯威格特的一声「OK, Joe」。没过多久，三顶降落伞在电视画面里打开，控制室里的人站起来鼓掌，有人点起了雪茄。
source: NASA 阿波罗 13 号任务记录
